<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E1 Alarm</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background:#0b0f14; color:#e6edf3; min-height:100dvh; display:flex; flex-direction:column;
         align-items:center; justify-content:center; padding:24px; text-align:center; }
  h1 { font-size:1.15rem; font-weight:600; letter-spacing:.02em; margin:0 0 4px; color:#9fb3c8; }
  #status { font-size:.95rem; color:#8aa0b6; margin:6px 0 18px; min-height:1.4em; }
  .dot { display:inline-block; width:.6em; height:.6em; border-radius:50%; margin-right:.4em;
         vertical-align:baseline; background:#3fb950; }
  .dot.bad { background:#f85149; } .dot.warn { background:#d29922; } .dot.idle { background:#6e7681; }
  button { font: inherit; border:0; border-radius:14px; cursor:pointer; font-weight:700; }
  #arm { background:#238636; color:#fff; font-size:1.4rem; padding:22px 46px; }
  #arm:disabled { background:#30363d; color:#8b949e; }
  #panel[hidden] { display:none; }
  #reason { font-size:1.25rem; font-weight:700; color:#ffb3b0; margin:6px 0 16px; min-height:1.4em; }
  .row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  #stop { background:#da3633; color:#fff; font-size:1.9rem; padding:26px 60px; width:min(92vw,420px); }
  .snooze { background:#1f6feb; color:#fff; font-size:1.05rem; padding:16px 20px; flex:1 1 30%; min-width:96px; }
  .muted { background:#21262d; color:#c9d1d9; }
  small { color:#6e7681; display:block; margin-top:20px; line-height:1.5; max-width:44ch; }
  .big { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <h1>E1 LAPTOP ALARM</h1>
  <div id="status"><span class="dot idle"></span>Not armed. Tap ARM once and leave this page open.</div>

  <button id="arm">🔔 ARM</button>

  <div id="panel" hidden>
    <div id="reason"></div>
    <div class="row" style="margin-bottom:14px;">
      <button id="stop">STOP</button>
    </div>
    <div class="row">
      <button class="snooze" data-min="5">Snooze 5m</button>
      <button class="snooze" data-min="15">Snooze 15m</button>
      <button class="snooze" data-min="30">Snooze 30m</button>
    </div>
    <button id="test" class="muted snooze" style="margin-top:14px;flex:0 0 auto;">Test sound</button>
  </div>

  <small id="hint"></small>

<script>
(function () {
  "use strict";
  var HEARTBEAT_URL = "data/heartbeat.json";
  var STALE_MS = 6 * 60 * 1000;     // "no ⏱ heartbeat for 6 minutes" (R-E1-TIMER+CLOCK part 3)
  var POLL_MS = 60 * 1000;          // poll every 60 s

  var armed = false, alarming = false, snoozeUntil = 0;
  var ackSummon = null, ackFinished = null, ackStaleStamp = null;
  var audio = null, beepTimer = null, wakeLock = null;

  var $ = function (id) { return document.getElementById(id); };
  var statusEl = $("status"), reasonEl = $("reason"), panel = $("panel"), hint = $("hint");

  hint.textContent = "This page rings when the E1 machine stops sending progress for 6 minutes, "
    + "when it needs you (🙋), or when a session finishes. Keep it open on a spare phone or tab. "
    + "It also polls every 60s and keeps the screen awake.";

  function ensureAudio() {
    if (!audio) {
      var C = window.AudioContext || window.webkitAudioContext;
      if (C) audio = new C();
    }
    if (audio && audio.state === "suspended") audio.resume();
    return audio;
  }

  function beepOnce() {
    var ctx = ensureAudio();
    if (!ctx) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "square"; o.frequency.value = 880;
    g.gain.value = 0.0001;
    o.connect(g); g.connect(ctx.destination);
    var t = ctx.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.6, t + 0.02);   // loud
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    o.start(t); o.stop(t + 0.46);
    if (navigator.vibrate) { try { navigator.vibrate([400, 150, 400]); } catch (e) {} }
  }

  function startAlarm(reason) {
    if (alarming) { reasonEl.textContent = reason; return; }
    alarming = true;
    reasonEl.textContent = reason;
    ensureAudio();
    beepOnce();
    beepTimer = setInterval(beepOnce, 850);
    document.title = "🚨 E1 ALARM";
  }

  function stopSound() {
    alarming = false;
    if (beepTimer) { clearInterval(beepTimer); beepTimer = null; }
    document.title = "E1 Alarm";
    reasonEl.textContent = "";
  }

  async function requestWake() {
    try {
      if ("wakeLock" in navigator) {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", function () { wakeLock = null; });
      }
    } catch (e) {}
  }
  document.addEventListener("visibilitychange", function () {
    if (armed && document.visibilityState === "visible" && !wakeLock) requestWake();
  });

  function fmtAge(ms) {
    var m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000);
    return m + "m " + s + "s";
  }

  async function poll() {
    if (!armed) return;
    var hb;
    try {
      var r = await fetch(HEARTBEAT_URL + "?cb=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      hb = await r.json();
    } catch (e) {
      statusEl.innerHTML = '<span class="dot warn"></span>Cannot read the heartbeat file (' +
        String(e.message || e) + "). Retrying…";
      return;   // a transient fetch error is NOT a death signal — do not ring on it
    }

    var now = Date.now();
    var hbTime = hb.heartbeat_ist ? Date.parse(hb.heartbeat_ist) : null;
    var age = hbTime ? now - hbTime : null;

    // decide triggers
    var reasons = [];
    if (hb.summon_ist && hb.summon_ist !== ackSummon) reasons.push("🙋 The machine needs you.");
    if (hb.session_finished_ist && hb.session_finished_ist !== ackFinished) reasons.push("✅ A session finished.");
    var stale = (age !== null && age > STALE_MS && hb.heartbeat_ist !== ackStaleStamp);
    if (stale) reasons.push("⏱ No progress for " + fmtAge(age) + " — the machine may be down.");

    var snoozed = now < snoozeUntil;
    if (reasons.length && !snoozed) {
      startAlarm(reasons.join("  "));
    }

    // status line (when not actively alarming)
    if (!alarming) {
      if (snoozed) {
        statusEl.innerHTML = '<span class="dot warn"></span>Snoozed for ' +
          fmtAge(snoozeUntil - now) + ". Armed and watching.";
      } else if (age === null) {
        statusEl.innerHTML = '<span class="dot idle"></span>Armed. Waiting for the first heartbeat…';
      } else {
        var cls = age > STALE_MS ? "bad" : (age > STALE_MS * 0.6 ? "warn" : "");
        statusEl.innerHTML = '<span class="dot ' + cls + '"></span>Armed. Last progress <span class="big">' +
          fmtAge(age) + "</span> ago.";
      }
    }
  }

  function acknowledgeAll() {
    // fetch-free ack from the last known status: re-read on next poll; here mark current DOM state seen
    return fetch(HEARTBEAT_URL + "?cb=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : {}; })
      .catch(function () { return {}; })
      .then(function (hb) {
        ackSummon = hb.summon_ist || ackSummon;
        ackFinished = hb.session_finished_ist || ackFinished;
        ackStaleStamp = hb.heartbeat_ist || ackStaleStamp;   // mute this stale stamp until it advances
      });
  }

  $("arm").addEventListener("click", async function () {
    armed = true;
    $("arm").disabled = true;
    $("arm").textContent = "✓ ARMED";
    panel.hidden = false;
    ensureAudio();
    await requestWake();
    await acknowledgeAll();   // don't fire on events that already existed at arm time
    poll();
    setInterval(poll, POLL_MS);
  });

  $("stop").addEventListener("click", async function () {
    stopSound();
    snoozeUntil = 0;
    await acknowledgeAll();   // this event is handled; mute until a NEW one appears
    poll();
  });

  document.querySelectorAll(".snooze[data-min]").forEach(function (b) {
    b.addEventListener("click", function () {
      snoozeUntil = Date.now() + parseInt(b.dataset.min, 10) * 60000;
      stopSound();
      poll();
    });
  });

  $("test").addEventListener("click", function () { ensureAudio(); beepOnce(); });
})();
</script>
</body>
</html>
